# Render: New + -> Blueprint -> pick this repo -> Apply. The trained models are in models/, so nothing trains on the server.
services:
  - type: web
    name: ai-quality
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ADMIN_KEY             # lets the station send readings (set it in the Render dashboard)
        sync: false
      - key: TELEGRAM_BOT_TOKEN    # optional: sends the alerts by Telegram
        sync: false
      - key: TELEGRAM_CHAT_ID      # optional: health partners' chat
        sync: false
      - key: TELEGRAM_DATA_CHAT_ID # optional: data team's chat
        sync: false
