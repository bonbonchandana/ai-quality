# Render blueprint: New + -> Blueprint -> pick this repo -> Apply.
services:
  - type: web
    name: ai-quality
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOW_UPLOAD
        value: "false"
