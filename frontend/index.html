<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Quality Nowcast</title>
  <meta name="description" content="Virtual-sensor CO estimation and pollution episode detection on the UCI Air Quality dataset.">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('aq-theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      try { if (localStorage.getItem('aq-sidebar') === 'collapsed') document.documentElement.classList.add('sidebar-collapsed'); } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1120'/%3E%3Cpath d='M6 20c4 0 4-8 8-8s4 10 8 10 3-6 4-6' fill='none' stroke='%2322d3ee' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="9" fill="currentColor" opacity=".14"/><path d="M6 20c4 0 4-8 8-8s4 10 8 10 3-6 4-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-text"><strong>AirSense</strong><small>CO virtual sensor</small></span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span class="nav-label">UCI Air Quality · 2004–2005</span>
      </div>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="navToggle" type="button" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSubtitle"></p>
        </div>
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </header>
      <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./vendor/echarts.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
