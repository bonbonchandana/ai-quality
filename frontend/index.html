<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Health Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <!-- Sign-in. The real check will happen on the backend. -->
  <section id="signin" class="signin" hidden>
    <div class="signin-card">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/><path d="M3 12h4l2-3 3 6 2-3h7"/></svg></span>
        <div><h1>Air Health Portal</h1><p>Air pollution forecasts and health alerts</p></div>
      </div>
      <form id="signin-form" novalidate>
        <label>Email<input id="signin-email" type="email" autocomplete="username" required placeholder="name@organisation.org"></label>
        <label>Password<input id="signin-password" type="password" autocomplete="current-password" required></label>
        <p id="signin-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn primary wide">Sign in</button>
      </form>
      <p class="fine">Preview accounts: <code>admin@demo.health</code>, <code>doctor@demo.health</code> or
        <code>viewer@demo.health</code>, password <code>demo123</code>.</p>
    </div>
  </section>

  <!-- The portal, shown after sign-in -->
  <div id="shell" class="shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/><path d="M3 12h4l2-3 3 6 2-3h7"/></svg></span>
        <strong>Air Health Portal</strong>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="me">
        <b id="me-name"></b>
        <button type="button" id="signout" class="btn ghost small">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button type="button" id="menu-toggle" class="icon-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h2 id="page-title"></h2>
        <div id="pollutant" class="pills" role="group" aria-label="Pollutant"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <div id="scrim" class="scrim" hidden></div>
  </div>

  <script src="vendor/echarts.min.js"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
